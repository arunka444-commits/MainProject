{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Service | BookMyService</title>

    <link rel="stylesheet" href="{% static 'css/add_service.css' %}">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="form-card">

        <div class="header">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            <h2>Add New Service</h2>
        </div>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label>Service Name</label>
                <input type="text" name="service_name" placeholder="Enter service name">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category">
                    <option>Select Category</option>
                    <option>Home Appliance Repair</option>
                    <option>Electrical Services</option>
                    <option>Plumbing Services</option>
                    <option>Cleaning Services</option>
                    <option>Painting Services</option>
                </select>
            </div>

            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" name="price" placeholder="Enter price">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4"
                placeholder="Enter service description"></textarea>
            </div>

            <div class="form-group">
                <label>Service Image</label>
                <input type="file" name="image">
            </div>

            <div class="form-group">
                <label>Availability</label>
                <select name="availability">
                    <option>Available</option>
                    <option>Unavailable</option>
                </select>
            </div>

            <button type="submit" class="btn">
                Add Service
            </button>

        </form>

    </div>

</div>

</body>
</html>
