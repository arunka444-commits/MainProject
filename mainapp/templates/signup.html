<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | BookMyService</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    
    <div class="form-wrapper">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 56 56" width="26" height="26">
                    <path d="M20 16 L20 40 M20 16 L28 16 Q34 16 34 21 Q34 26 28 26 L20 26 M20 26 L29 26 Q35 26 35 32 Q35 38 29 38 L20 38"
                          fill="none" stroke="#c9a24b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
            <div class="brand-text-group">
                <div class="brand-text">
                    <span class="brand-book">Book</span><span class="brand-my">My</span><span class="brand-service">Service</span>
                </div>
                <div class="brand-tagline">Best Booking Platform</div>
            </div>
        </div>

        <div class="form-card">
            <h1>Create Your Account</h1>
            <p class="subtitle">Join thousands of professionals managing bookings with ease.</p>

            <form action="{% url 'signupuser' %}" method="post">
                {% csrf_token %}
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstname">First Name</label>
                        <input type="text" id="firstname" name="firstname" placeholder="John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastname">Last Name</label>
                        <input type="text" id="lastname" name="lastname" placeholder="Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="johndoe" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="number">Phone Number</label>
                    <input type="tel" id="number" name="number" placeholder="+91 98765 43210" required>
                        </div>
                        <div class="form-group">
            <label for="role">Register As</label>
            <select id="role" name="role" required>
                <option value="" selected disabled>Select your account type</option>
                <option value="customer">Customer</option>
                <option value="service_provider">Service Provider</option>
                <option value="employee">Service Employee</option>
            </select>
        </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confpass">Confirm Password</label>
                    <input type="password" id="confpass" name="confpass" placeholder="••••••••" required>
                </div>

                <label class="terms-check">
                    <input type="checkbox" name="terms" required>
                    I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                </label>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="{% url 'welcome' %}">Sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
